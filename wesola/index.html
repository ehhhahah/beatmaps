   <body class="wesola-map">

   <script src="../script.js"></script>
   <script>
      (function loadWesolaSvg() {
         const container = document.querySelector('.svgContainer');
         // Resolve against the page URL so local preview works despite <base href>
         const svgUrl = new URL('wesola.svg', window.location.href);

         fetch(svgUrl)
            .then(function (response) {
               if (!response.ok) {
                  throw new Error('HTTP ' + response.status);
               }
               return response.text();
            })
            .then(function (svgText) {
               container.innerHTML = svgText;
               const svg = container.querySelector('svg');
               if (!svg) {
                  throw new Error('No <svg> root in wesola.svg');
               }
               svg.id = 'svgmap';
               // Shared script.js looks up #svgmap at load time; refresh after inject
               if (typeof map !== 'undefined') {
                  map = svg;
               }
            })
            .catch(function () {
               container.innerHTML =
                  '<p class="svg-missing">Add <code>wesola/wesola.svg</code> here — this page loads it automatically.</p>';
            });
      })();
   </script>

   <script>
      /** Keep in sync with ``SOUND_EXT`` in ``maps/helpers/credits_organizer.py``. */
      var WESOLA_SOUND_EXT = { 25: '.mp3', 29: '.mp3', 68: '.mp3' };

      function wesolaSoundsRoot() {
         return new URL('sounds/', window.location.href);
      }

      function wesolaFileExt(soundId) {
         return WESOLA_SOUND_EXT[soundId] || '.wav';
      }

      /** Pre-create audio pair so playSound toggles without overwriting paths (page-local URLs). */
      function ensureWesolaAudio(soundId) {
         if (ALL_AUDIOS[soundId]) {
            return;
         }
         var root = wesolaSoundsRoot();
         var ext = wesolaFileExt(soundId);
         var near = new URL(String(soundId) + ext, root).href;
         var far = new URL(String(soundId) + '_mod' + ext, root).href;
         ALL_AUDIOS[soundId] = {
            id: soundId,
            audio: [new Audio(near), new Audio(far)],
            is_playing: false
         };
      }

      function playWesolaSound(soundId) {
         ensureWesolaAudio(soundId);
         var ext = wesolaFileExt(soundId);
         playSound('wesola/', soundId, ext, ext);
      }

      function wireWesolaPieces(svg) {
         var decorative = svg.querySelectorAll(
            '#layer-small, #layer-network-roads, #layer-network-trains, #layer-guide-rail-band'
         );
         for (var d = 0; d < decorative.length; d++) {
            decorative[d].style.pointerEvents = 'none';
         }

         var pieces = svg.querySelectorAll('g[id^="layer-piece-"]');
         for (var i = 0; i < pieces.length; i++) {
            var g = pieces[i];
            var match = g.id.match(/^layer-piece-(\d+)$/);
            if (!match) {
               continue;
            }
            var id = match[1];
            g.classList.add('puzzle', 'piece' + id);
            g.setAttribute('onclick', "playWesolaSound(" + id + ")");
         }
      }

      function loadWesolaSvg() {
         var container = document.getElementById('svgContainer');
         var svgUrl = new URL('maps/wesola_layered.svg', window.location.href);

         fetch(svgUrl)
            .then(function (response) {
               if (!response.ok) {
                  throw new Error('HTTP ' + response.status);
               }
               return response.text();
            })
            .then(function (svgText) {
               container.innerHTML = svgText;
               var svg = container.querySelector('svg');
               if (!svg) {
                  throw new Error('No <svg> root in wesola_layered.svg');
               }
               svg.id = 'svgmap';
               svg.setAttribute('transform', 'scale(1)');
               svg.setAttribute('width', '1700px');
               svg.setAttribute('height', 'auto');
               svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
               wireWesolaPieces(svg);
               if (typeof map !== 'undefined') {
                  map = svg;
               }
               if (typeof RangeTouch !== 'undefined' && document.querySelector('input[type="range"]')) {
                  new RangeTouch('input[type="range"]');
               }
            })
            .catch(function () {
               container.innerHTML =
                  '<p class="svg-missing">Add <code>wesola/maps/wesola_layered.svg</code> here — this page loads it automatically.</p>';
            });
      }

      loadWesolaSvg();
   </script>

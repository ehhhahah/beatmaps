   <script src="../script.js"></script>
   <script>
      // Page-local toggle so dummy.wav resolves against this origin (not <base href>).
      function playWesolaPiece(soundId) {
         var soundIndex = soundId;
         if (!ALL_AUDIOS[soundIndex]) {
            var dummyUrl = new URL('sounds/dummy.wav', window.location.href).href;
            var dummyModUrl = new URL('sounds/dummy_mod.wav', window.location.href).href;
            ALL_AUDIOS[soundIndex] = {
               id: soundIndex,
               audio: [new Audio(dummyUrl), new Audio(dummyModUrl)],
               is_playing: false
            };
         }

         var entry = ALL_AUDIOS[soundIndex];
         if (entry.is_playing) {
            entry.audio.forEach(function (audioObj) {
               audioObj.pause();
            });
            entry.is_playing = false;
         } else {
            entry.audio.forEach(function (audioObj) {
               if (typeof setModAudioVolumeByZoom === 'function') {
                  setModAudioVolumeByZoom();
               }
               audioObj.loop = true;
               audioObj.play();
            });
            entry.is_playing = true;
         }

         var piece = document.getElementsByClassName('piece' + soundId)[0];
         if (piece) {
            piece.classList.toggle('piece-active');
         }
      }

      function wireWesolaPieces(svg) {
         // Only piece-* layers are interactive; roads/trains/guides stay inert.
         var decorative = svg.querySelectorAll(
            '#layer-small, #layer-network-roads, #layer-network-trains, #layer-guide-rail-band'
         );
         for (var d = 0; d < decorative.length; d++) {
            decorative[d].style.pointerEvents = 'none';
         }

         var pieces = svg.querySelectorAll('g[id^="layer-piece-"]');
         for (var i = 0; i < pieces.length; i++) {
            var g = pieces[i];
            var match = g.id.match(/^layer-piece-(\d+)$/);
            if (!match) {
               continue;
            }
            var id = match[1];
            g.classList.add('puzzle', 'piece' + id);
            g.setAttribute('onclick', 'playWesolaPiece(' + id + ')');
         }
      }

      (function loadWesolaSvg() {
         const container = document.querySelector('.svgContainer');
         // Resolve against the page URL so local preview works despite <base href>
         const svgUrl = new URL('maps/wesola_layered.svg', window.location.href);

         fetch(svgUrl)
            .then(function (response) {
               if (!response.ok) {
                  throw new Error('HTTP ' + response.status);
               }
               return response.text();
            })
            .then(function (svgText) {
               container.innerHTML = svgText;
               const svg = container.querySelector('svg');
               if (!svg) {
                  throw new Error('No <svg> root in wesola_layered.svg');
               }
               svg.id = 'svgmap';
               // Responsive: viewBox + width 100% so the map scales to the viewport
               var w = parseFloat(svg.getAttribute('width')) || 2048;
               var h = parseFloat(svg.getAttribute('height')) || 2732;
               if (!svg.getAttribute('viewBox')) {
                  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
               }
               svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
               svg.setAttribute('width', '100%');
               svg.removeAttribute('height');
               wireWesolaPieces(svg);
               // Shared script.js looks up #svgmap at load time; refresh after inject
               if (typeof map !== 'undefined') {
                  map = svg;
               }
            })
            .catch(function () {
               container.innerHTML =
                  '<p class="svg-missing">Add <code>wesola/maps/wesola_layered.svg</code> here — this page loads it automatically.</p>';
            });
      })();
   </script>
